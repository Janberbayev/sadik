  <!-- shine -->
  <ellipse cx="24" cy="28" rx="5" ry="7" fill="url(#shine)" transform="rotate(-15 24 28)"/>
  <!-- eyes -->
  <ellipse cx="27" cy="36" rx="3.2" ry="3.8" fill="#fff"/>
  <ellipse cx="37" cy="35" rx="3" ry="3.5" fill="#fff"/>
  <ellipse cx="28" cy="37.2" rx="1.8" ry="2.1" fill="#2C1106"/>
  <ellipse cx="38" cy="36.2" rx="1.7" ry="2" fill="#2C1106"/>
  <circle cx="28.6" cy="36.4" r=".6" fill="#fff"/>
  <circle cx="38.5" cy="35.5" r=".55" fill="#fff"/>
  <!-- smile -->
  <path d="M25 43c3 4.5 11 4.5 14 1" fill="none" stroke="#1a1a2e" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="21" cy="42" rx="3.5" ry="2" fill="#FF8282" opacity=".4"/>
  <ellipse cx="42" cy="41" rx="3.2" ry="1.8" fill="#FF8282" opacity=".4"/>
