<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alma Balabaqshasy">
  <defs>
    <radialGradient id="apple" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="45%" stop-color="#E52228"/>
      <stop offset="100%" stop-color="#9A1020"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- leaf -->
  <path d="M34 12c-3.5-6-10-7.5-11-3.5-1 4 5.5 5.5 11 3.5z" fill="#55C97A" stroke="#33A85A" stroke-width="1"/>
  <!-- stem -->
  <path d="M33.5 12c1-3.5 2-7 2.5-9.5" fill="none" stroke="#7B4A2B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- body -->
